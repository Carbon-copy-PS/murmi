<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" class="htr-chart" role="img" lang="zh-Hant-TW" xml:lang="zh-Hant-TW" aria-labelledby="key-statements-title key-statements-desc">
<title id="key-statements-title">關鍵題目的五點量表分布</title>
<desc id="key-statements-desc">八題關鍵題目的非常同意、同意、中立、不同意與非常不同意百分比分布，並標示各題作答人數。</desc>
<style>

