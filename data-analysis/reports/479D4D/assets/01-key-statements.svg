.htr-chart .title{font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;font-size:44px;font-weight:400;letter-spacing:-.5px}
.htr-chart .subtitle{font-size:22px;fill:#60656A}
