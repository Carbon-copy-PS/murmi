<g class="chart-title">
<text x="72" y="72" class="title">三種可重疊的傾向，呈現治理重點的差異</text>
<text x="72" y="112" class="subtitle">同一人可能接近多種傾向；半透明區域呈現政策重點，不代表固定身分。</text>
</g>
