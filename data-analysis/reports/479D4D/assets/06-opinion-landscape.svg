<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" class="htr-chart" role="img" lang="zh-Hant-TW" xml:lang="zh-Hant-TW" aria-labelledby="opinion-tendencies-title opinion-tendencies-desc">
<title id="opinion-tendencies-title">兩條意見差異與三種可重疊的傾向</title>
<desc id="opinion-tendencies-desc">探索性意見地圖以兩條作答差異軸呈現三種可重疊的柔性取向：救濟與參與、事前防護、彈性治理。圖中不替參與者指定固定陣營。</desc>
