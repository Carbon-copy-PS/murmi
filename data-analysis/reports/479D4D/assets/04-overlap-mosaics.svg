<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" class="htr-chart" role="img" lang="zh-Hant-TW" xml:lang="zh-Hant-TW" aria-labelledby="core-tensions-title core-tensions-desc">
<title id="core-tensions-title">三組政策主張的支持重疊圖</title>
<desc id="core-tensions-desc">三組依人數比例繪製的文氏圖，呈現共同作答者支持 A、支持 B、同時支持兩項，或兩項都未支持的人數。</desc>
<style>

.htr-chart text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;fill:#161616;font-weight:400}
.htr-chart .title{font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;font-size:44px;font-weight:400;letter-spacing:-.5px}
.htr-chart .subtitle{font-size:22px;fill:#60656A}
.htr-chart .section{font-size:26px;font-weight:500}
.htr-chart .body{font-size:22px}
.htr-chart .compact{font-size:19px}
.htr-chart .small{font-size:18px;fill:#60656A}
.htr-chart .tiny{font-size:16px;fill:#60656A}
.htr-chart .value{font-size:20px;font-weight:500}
.htr-chart .label{font-size:20px;font-weight:500}
.htr-chart .point-number{font-size:12px;font-weight:500;fill:#161616;pointer-events:none}
.htr-chart .grid{stroke:#D7D9D9;stroke-width:1}
.htr-chart .axis{stroke:#60656A;stroke-width:1.5}
.htr-chart .callout{font-weight:500}
</style>
<rect width="1440" height="900" fill="#FFFFFF"/>
<g class="chart-title">
<text x="72" y="72" class="title">許多人同時支持看似拉扯的兩種做法</text>
<text x="72" y="112" class="subtitle">兩個圓的重疊區，代表同一位參與者同時支持兩項主張。</text>
</g>
<line x1="72" x2="1368" y1="142" y2="142" class="grid"/>
<text x="272" y="188" text-anchor="middle" class="section">事前預防＋事後救濟</text>
<text x="272" y="220" text-anchor="middle" class="small">60 人共同回答兩題</text>
<text x="164" y="274" text-anchor="middle" class="compact">A・影響評估</text>
<text x="380" y="274" text-anchor="middle" class="compact">B・被害人協助</text>
<circle cx="237.17820101292125" cy="440" r="118" fill="#0E747E" fill-opacity="0.28" stroke="#0E747E" stroke-width="3"/>
<circle cx="308.17041470662775" cy="440" r="116.65138428045101" fill="#6E6598" fill-opacity="0.26" stroke="#6E6598" stroke-width="3"/>
<text x="272.6743078597745" y="416" text-anchor="middle" class="label">兩項都支持</text>
<text x="272.6743078597745" y="465" text-anchor="middle" style="font-size:42px;font-weight:500;fill:#161616">45%</text>
<text x="272.6743078597745" y="494" text-anchor="middle" class="tiny">27 人</text>
<text x="158" y="590" text-anchor="middle" class="small">只支持 A 28.3%</text>
<text x="386" y="590" text-anchor="middle" class="small">只支持 B 26.7%</text>
<text x="272" y="632" text-anchor="middle" class="small">所有人至少支持一項</text>
<line x1="488" x2="488" y1="170" y2="650" class="grid"/>
<text x="704" y="188" text-anchor="middle" class="section">年齡界線＋情境判斷</text>
<text x="704" y="220" text-anchor="middle" class="small">36 人共同回答兩題</text>
<text x="596" y="274" text-anchor="middle" class="compact">A・年齡界線</text>
<text x="812" y="274" text-anchor="middle" class="compact">B・情境判斷</text>
<circle cx="692.8387507345237" cy="440" r="118" fill="#0E747E" fill-opacity="0.28" stroke="#0E747E" stroke-width="3"/>
<circle cx="726.426233284948" cy="440" r="106.73501598052833" fill="#6E6598" fill-opacity="0.26" stroke="#6E6598" stroke-width="3"/>
<text x="709.6324920097359" y="416" text-anchor="middle" class="label">兩項都支持</text>
<text x="709.6324920097359" y="465" text-anchor="middle" style="font-size:42px;font-weight:500;fill:#161616">66.7%</text>
<text x="709.6324920097359" y="494" text-anchor="middle" class="tiny">24 人</text>
<text x="590" y="590" text-anchor="middle" class="small">只支持 A 25%</text>
<text x="818" y="590" text-anchor="middle" class="small">只支持 B 8.3%</text>
<text x="704" y="632" text-anchor="middle" class="small">所有人至少支持一項</text>
<line x1="920" x2="920" y1="170" y2="650" class="grid"/>
<text x="1136" y="188" text-anchor="middle" class="section">權利保障＋創作自由</text>
<text x="1136" y="220" text-anchor="middle" class="small">26 人共同回答兩題</text>
<text x="1028" y="274" text-anchor="middle" class="compact">A・限制擴張監控</text>
<text x="1244" y="274" text-anchor="middle" class="compact">B・保障創作自由</text>
<circle cx="1118.0778352917255" cy="440" r="111.61682574537625" fill="#0E747E" fill-opacity="0.28" stroke="#0E747E" stroke-width="3"/>
<circle cx="1147.5389904536507" cy="440" r="118" fill="#6E6598" fill-opacity="0.26" stroke="#6E6598" stroke-width="3"/>
<text x="1132.8084128726882" y="416" text-anchor="middle" class="label">兩項都支持</text>
<text x="1132.8084128726882" y="465" text-anchor="middle" style="font-size:42px;font-weight:500;fill:#161616">57.7%</text>
<text x="1132.8084128726882" y="494" text-anchor="middle" class="tiny">15 人</text>
<text x="1022" y="590" text-anchor="middle" class="small">只支持 A 7.7%</text>
<text x="1250" y="590" text-anchor="middle" class="small">只支持 B 15.4%</text>
<text x="1136" y="632" text-anchor="middle" class="small">兩項都未支持 19.2% · 5 人</text>
<line x1="72" x2="1368" y1="682" y2="682" class="grid"/>
<text x="72" y="724" text-anchor="start" class="small">每組內的圓面積與重疊面積依人數比例繪製；組與組的大小不可直接比較。支持包含同意與非常同意。</text>
</svg>