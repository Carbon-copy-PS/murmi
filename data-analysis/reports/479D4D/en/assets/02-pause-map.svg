<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" class="htr-chart" role="img" lang="en" xml:lang="en" aria-labelledby="pause-map-en-title pause-map-en-desc">
<title id="pause-map-en-title">Prompts with the highest neutral response shares</title>
<desc id="pause-map-en-desc">A ranked lollipop chart of the five prompts with the highest neutral shares. Percentages use each prompt&apos;s respondents, and prompts with fewer than half of voters responding are marked as having fewer responses.</desc>
<style>

.htr-chart text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;fill:#161616;font-weight:400}
.htr-chart .title{font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;font-size:44px;font-weight:400;letter-spacing:-.5px}
.htr-chart .subtitle{font-size:22px;fill:#60656A}
.htr-chart .section{font-size:26px;font-weight:500}
.htr-chart .body{font-size:22px}
.htr-chart .compact{font-size:19px}
.htr-chart .small{font-size:18px;fill:#60656A}
.htr-chart .tiny{font-size:16px;fill:#60656A}
.htr-chart .value{font-size:20px;font-weight:500}
.htr-chart .label{font-size:20px;font-weight:500}
.htr-chart .point-number{font-size:12px;font-weight:500;fill:#161616;pointer-events:none}
.htr-chart .grid{stroke:#D7D9D9;stroke-width:1}
.htr-chart .axis{stroke:#60656A;stroke-width:1.5}
.htr-chart .callout{font-weight:500}
</style>
<rect width="1440" height="880" fill="#FFFFFF"/>
<g class="chart-title">
<text x="72" y="72" class="title">Higher-neutral statements need follow-up</text>
<text x="72" y="112" class="subtitle">Neutral is not disagreement; this session did not measure why people chose it.</text>
</g>
<text x="1300" y="166" text-anchor="end" class="small">Neutral among statement respondents</text>
<line x1="720" x2="720" y1="182" y2="700" class="grid"/>
<text x="720" y="207" text-anchor="middle" class="tiny">0%</text>
<line x1="1010" x2="1010" y1="182" y2="700" class="grid"/>
<text x="1010" y="207" text-anchor="middle" class="tiny">25%</text>
<line x1="1300" x2="1300" y1="182" y2="700" class="grid"/>
<text x="1300" y="207" text-anchor="middle" class="tiny">50%</text>
<text x="72" y="258" class="small">#24</text>
<text x="126" y="248" text-anchor="start" class="compact">Can regulation keep pace with AI?†</text>
<text x="126" y="300" class="small">n = 23</text>
<rect x="215" y="278" width="170" height="30" rx="0" fill="none" stroke="#A86D24" stroke-width="1.5"/>
<text x="300" y="299" text-anchor="middle" class="tiny" style="fill:#A86D24">FEWER RESPONSES</text>
<line x1="720" x2="1224.3478260869565" y1="258" y2="258" stroke="#6E6598" stroke-width="8" stroke-linecap="round"/>
<circle cx="1224.3478260869565" cy="258" r="11" fill="#FFFFFF" stroke="#6E6598" stroke-width="5"/>
<text x="1244.3478260869565" y="265" class="label">43.5%</text>
<text x="72" y="360" class="small">#13</text>
<text x="126" y="350" text-anchor="start" class="compact">Majority-supported positions may contradict one</text><text x="126" y="372" text-anchor="start" class="compact">another</text>
<text x="126" y="402" class="small">n = 37</text>
<line x1="720" x2="1064.864864864865" y1="360" y2="360" stroke="#6E6598" stroke-width="8" stroke-linecap="round"/>
<circle cx="1064.864864864865" cy="360" r="11" fill="#FFFFFF" stroke="#6E6598" stroke-width="5"/>
<text x="1084.864864864865" y="367" class="label">29.7%</text>
<text x="72" y="462" class="small">#21</text>
<text x="126" y="452" text-anchor="start" class="compact">Establish an AI content rating system</text>
<text x="126" y="504" class="small">n = 29</text>
<rect x="215" y="482" width="170" height="30" rx="0" fill="none" stroke="#A86D24" stroke-width="1.5"/>
<text x="300" y="503" text-anchor="middle" class="tiny" style="fill:#A86D24">FEWER RESPONSES</text>
<line x1="720" x2="1000" y1="462" y2="462" stroke="#6E6598" stroke-width="8" stroke-linecap="round"/>
<circle cx="1000" cy="462" r="11" fill="#FFFFFF" stroke="#6E6598" stroke-width="5"/>
<text x="1020" y="469" class="label">24.1%</text>
<text x="72" y="564" class="small">#16</text>
<text x="126" y="554" text-anchor="start" class="compact">Prioritise family education, not government</text><text x="126" y="576" text-anchor="start" class="compact">intervention alone</text>
<text x="126" y="606" class="small">n = 35</text>
<rect x="215" y="584" width="170" height="30" rx="0" fill="none" stroke="#A86D24" stroke-width="1.5"/>
<text x="300" y="605" text-anchor="middle" class="tiny" style="fill:#A86D24">FEWER RESPONSES</text>
<line x1="720" x2="985.1428571428571" y1="564" y2="564" stroke="#6E6598" stroke-width="8" stroke-linecap="round"/>
<circle cx="985.1428571428571" cy="564" r="11" fill="#FFFFFF" stroke="#6E6598" stroke-width="5"/>
<text x="1005.1428571428571" y="571" class="label">22.9%</text>
<text x="72" y="666" class="small">#19</text>
<text x="126" y="656" text-anchor="start" class="compact">Involve more government and industry representatives</text>
<text x="126" y="708" class="small">n = 32</text>
<rect x="215" y="686" width="170" height="30" rx="0" fill="none" stroke="#A86D24" stroke-width="1.5"/>
<text x="300" y="707" text-anchor="middle" class="tiny" style="fill:#A86D24">FEWER RESPONSES</text>
<line x1="720" x2="973.75" y1="666" y2="666" stroke="#6E6598" stroke-width="8" stroke-linecap="round"/>
<circle cx="973.75" cy="666" r="11" fill="#FFFFFF" stroke="#6E6598" stroke-width="5"/>
<text x="993.75" y="673" class="label">21.9%</text>
<line x1="72" x2="1368" y1="764" y2="764" class="grid"/>
<text x="72" y="798" text-anchor="start" class="small">Neutral means the respondent selected the neutral option; it does not include missing responses. Percentages use each prompt’s</text><text x="72" y="820" text-anchor="start" class="small">respondents. Prompts with fewer than 36 responses are labelled ‘fewer responses’.</text>
<text x="72" y="856" class="small">† Q24 was phrased as a question, making its response meaning less clear.</text>
</svg>